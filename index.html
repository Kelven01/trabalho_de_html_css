<<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- CABEÇALHO -->
        <header>
            <h1>Sistema de Cadastro</h1>
        </header>

        <!-- NAVEGAÇÃO -->
        <nav>
            <h2>Navegação</h2>

            <ul>
                <li><a href="#">Início</a></li>
                <li><a href="#">Cadastro</a></li>
                <li><a href="#">Sobre</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </nav>

        <!-- CONTEÚDO -->
        <main>
            <h2>Cadastro de Usuário</h2>

            <form>

                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome"
                       placeholder="Digite o seu nome" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email"
                       placeholder="Digite o seu e-mail" required>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password"
                       placeholder="Digite a sua password" required>

                <label>Sexo:</label>

                <div class="sexo">
                    <label>
                        <input type="radio" name="sexo" value="masculino">
                        Masculino
                    </label>

                    <label>
                        <input type="radio" name="sexo" value="feminino">
                        Feminino
                    </label>
                </div>

                <label for="endereco">Endereço:</label>
                <input type="text" id="endereco" name="endereco"
                       placeholder="Digite o seu endereço">

                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone"
                       placeholder="Digite o seu telefone">

                <label for="nacionalidade">Nacionalidade:</label>
                <input type="text" id="nacionalidade" name="nacionalidade"
                       placeholder="Digite a sua nacionalidade">

                <label for="nivel">Nível Académico:</label>

                <select id="nivel" name="nivel">
                    <option value="">Selecione</option>
                    <option value="medio">Ensino Médio</option>
                    <option value="tecnico">Técnico</option>
                    <option value="licenciatura">Licenciatura</option>
                    <option value="mestrado">Mestrado</option>
                    <option value="doutoramento">Doutoramento</option>
                </select>

                <label for="profissao">Profissão:</label>
                <input type="text" id="profissao" name="profissao"
                       placeholder="Digite a sua profissão">

                <button type="submit">Cadastrar</button>

            </form>
        </main>

        <!-- RODAPÉ -->
        <footer>
            <p>&copy; 2026 - Sistema de Cadastro</p>
        </footer>

    </div>

</body>
</html>
